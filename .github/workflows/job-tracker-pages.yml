name: Job Tracker - Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'job_tracker/frontend/**'
      - 'job_tracker/data/**'
  workflow_run:
    workflows: ['Job Tracker - Fetch Jobs']
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp job_tracker/frontend/*.html _site/
          cp job_tracker/data/*.json _site/data/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
