name: Job Tracker - Fetch Jobs

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: job-tracker-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r job_tracker/scripts/requirements.txt

      - name: Fetch and aggregate jobs
        run: python job_tracker/scripts/fetch_jobs.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add job_tracker/data/*.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(job-tracker): refresh job listings"
            git push
          fi
