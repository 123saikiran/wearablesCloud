<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
</style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
<div class="max-w-6xl mx-auto px-4 py-8">

  <header class="mb-6">
    <h1 class="text-3xl font-bold tracking-tight">Job Tracker</h1>
    <p class="text-slate-500 mt-1 text-sm" id="updated-at">Loading data&hellip;</p>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

    <aside class="lg:col-span-1 space-y-6">
      <div class="bg-white rounded-lg border border-slate-200 p-4">
        <label for="search" class="block text-sm font-medium text-slate-700 mb-2">Search</label>
        <input id="search" type="text" placeholder="Title, company, tag&hellip;"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />

        <div class="mt-4 flex items-center gap-2">
          <input id="saved-only" type="checkbox" class="rounded border-slate-300" />
          <label for="saved-only" class="text-sm text-slate-700">Saved only</label>
        </div>
      </div>

      <div class="bg-white rounded-lg border border-slate-200 p-4">
        <h2 class="text-sm font-semibold text-slate-700 mb-3">Companies</h2>
        <div id="company-list" class="space-y-1 max-h-96 overflow-y-auto text-sm"></div>
      </div>
    </aside>

    <main class="lg:col-span-3">
      <div class="flex items-center justify-between mb-3">
        <span id="result-count" class="text-sm text-slate-500"></span>
        <button id="clear-filters" class="text-sm text-indigo-600 hover:underline hidden">Clear filters</button>
      </div>
      <div id="job-list" class="space-y-3"></div>
      <div id="empty-state" class="hidden text-center text-slate-500 py-16">
        No jobs match your filters yet.
      </div>
    </main>

  </div>
</div>

<script>
const SAVED_KEY = "job-tracker:saved-ids";

const state = {
  jobs: [],
  companies: {},
  query: "",
  companyFilter: null,
  savedOnly: false,
  saved: new Set(JSON.parse(localStorage.getItem(SAVED_KEY) || "[]")),
};

function persistSaved() {
  localStorage.setItem(SAVED_KEY, JSON.stringify([...state.saved]));
}

function toggleSaved(id) {
  if (state.saved.has(id)) state.saved.delete(id);
  else state.saved.add(id);
  persistSaved();
  render();
}

function formatDate(iso) {
  if (!iso) return "Unknown date";
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return "Unknown date";
  return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
}

function matchesQuery(job, query) {
  if (!query) return true;
  const haystack = [job.title, job.company, job.location, ...(job.tags || [])]
    .join(" ")
    .toLowerCase();
  return haystack.includes(query.toLowerCase());
}

function filteredJobs() {
  return state.jobs.filter((job) => {
    if (state.companyFilter && job.company !== state.companyFilter) return false;
    if (state.savedOnly && !state.saved.has(job.id)) return false;
    if (!matchesQuery(job, state.query)) return false;
    return true;
  });
}

function renderCompanies() {
  const list = document.getElementById("company-list");
  const entries = Object.entries(state.companies).sort((a, b) => b[1].count - a[1].count);

  if (entries.length === 0) {
    list.innerHTML = '<p class="text-slate-400">No companies yet.</p>';
    return;
  }

  list.innerHTML = entries
    .map(([name, info]) => {
      const active = state.companyFilter === name;
      return `
        <button data-company="${encodeURIComponent(name)}"
          class="w-full flex items-center justify-between rounded px-2 py-1.5 text-left hover:bg-slate-100 ${active ? "bg-indigo-50 text-indigo-700 font-medium" : ""}">
          <span class="truncate">${escapeHtml(name)}</span>
          <span class="text-xs text-slate-400 ml-2">${info.count}</span>
        </button>`;
    })
    .join("");

  list.querySelectorAll("button[data-company]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const name = decodeURIComponent(btn.dataset.company);
      state.companyFilter = state.companyFilter === name ? null : name;
      render();
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

function renderJobs() {
  const jobs = filteredJobs();
  const list = document.getElementById("job-list");
  const empty = document.getElementById("empty-state");
  const count = document.getElementById("result-count");

  count.textContent = `${jobs.length} job${jobs.length === 1 ? "" : "s"}`;

  if (jobs.length === 0) {
    list.innerHTML = "";
    empty.classList.remove("hidden");
    return;
  }
  empty.classList.add("hidden");

  list.innerHTML = jobs
    .map((job) => {
      const isSaved = state.saved.has(job.id);
      const tags = (job.tags || [])
        .slice(0, 6)
        .map((t) => `<span class="text-xs bg-slate-100 text-slate-600 rounded-full px-2 py-0.5">${escapeHtml(t)}</span>`)
        .join(" ");
      return `
        <article class="bg-white rounded-lg border border-slate-200 p-4 flex items-start justify-between gap-4">
          <div class="min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <h3 class="font-semibold text-slate-900">${escapeHtml(job.title)}</h3>
              <span class="text-xs uppercase tracking-wide text-slate-400 border border-slate-200 rounded px-1.5 py-0.5">${escapeHtml(job.source || "")}</span>
            </div>
            <p class="text-sm text-slate-600 mt-0.5">${escapeHtml(job.company)} &middot; ${escapeHtml(job.location || "Remote")}</p>
            <p class="text-xs text-slate-400 mt-1">${formatDate(job.posted_at || job.fetched_at)}</p>
            <div class="flex flex-wrap gap-1 mt-2">${tags}</div>
          </div>
          <div class="flex flex-col items-end gap-2 shrink-0">
            <button data-save="${job.id}" class="text-xl leading-none" title="Save job">
              ${isSaved ? "★" : "☆"}
            </button>
            <a href="${job.url}" target="_blank" rel="noopener noreferrer"
              class="text-sm bg-indigo-600 text-white rounded-md px-3 py-1.5 hover:bg-indigo-700">Apply</a>
          </div>
        </article>`;
    })
    .join("");

  list.querySelectorAll("button[data-save]").forEach((btn) => {
    btn.addEventListener("click", () => toggleSaved(btn.dataset.save));
  });
}

function render() {
  renderCompanies();
  renderJobs();
  document.getElementById("clear-filters").classList.toggle(
    "hidden",
    !state.companyFilter && !state.query && !state.savedOnly
  );
}

async function loadData() {
  const updatedAtEl = document.getElementById("updated-at");
  try {
    const [jobsRes, companiesRes] = await Promise.all([
      fetch("./data/jobs.json", { cache: "no-store" }),
      fetch("./data/companies.json", { cache: "no-store" }),
    ]);
    const jobsData = await jobsRes.json();
    const companiesData = await companiesRes.json();

    state.jobs = jobsData.jobs || [];
    state.companies = companiesData.companies || {};

    updatedAtEl.textContent = jobsData.updated_at
      ? `Last updated ${new Date(jobsData.updated_at).toLocaleString()} &middot; ${state.jobs.length} active listings`
      : "No data yet — waiting for the first scheduled fetch.";
    updatedAtEl.innerHTML = updatedAtEl.textContent;
    render();
  } catch (err) {
    updatedAtEl.textContent = "Failed to load job data.";
    console.error(err);
  }
}

document.getElementById("search").addEventListener("input", (e) => {
  state.query = e.target.value;
  render();
});

document.getElementById("saved-only").addEventListener("change", (e) => {
  state.savedOnly = e.target.checked;
  render();
});

document.getElementById("clear-filters").addEventListener("click", () => {
  state.query = "";
  state.companyFilter = null;
  state.savedOnly = false;
  document.getElementById("search").value = "";
  document.getElementById("saved-only").checked = false;
  render();
});

loadData();
</script>
</body>
</html>
